<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MyRebootAI</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: white;
    }

    html {
      scroll-behavior: smooth;
    }

    @keyframes breathe {
      0% { transform: scale(1.02); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1.02); }
    }

    .breathe {
      animation: breathe 14s ease-in-out infinite;
    }
  </style>
</head>

<body class="overflow-x-hidden">

<!-- HERO -->
<section class="relative h-screen overflow-hidden">

  <!-- BACKGROUND IMAGE (FULL SCREEN) -->
  <img
    src="silhouette.jpg"
    class="absolute inset-0 w-full h-full object-cover object-center breathe scale-110 opacity-70"
    alt="AI Visual"
  />

  <!-- DARK + PURPLE OVERLAY -->
  <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/70 to-purple-950/40"></div>

  <!-- TEXT OVERLAY -->
  <div class="relative z-10 h-full">

    <div class="max-w-7xl mx-auto px-6 h-full flex items-start pt-[18vh]">

      <div class="max-w-xl text-left">

        <p class="uppercase tracking-[0.35em] text-purple-200 text-xs sm:text-sm mb-5">
          Emotional AI for Women in Transition
        </p>

        <h1 class="font-bold leading-tight mb-6"
            style="font-size: clamp(2.4rem, 4vw, 4.8rem);">
          You don’t need to be fixed.<br>
          <span class="text-purple-300">You need space to reconnect.</span>
        </h1>

        <p class="text-slate-200 leading-relaxed mb-8"
           style="font-size: clamp(1rem, 1.4vw, 1.25rem);">
          MyRebootAI is an emotionally adaptive AI companion designed to support women through burnout, identity shifts, emotional overwhelm, and quiet life transitions.
        </p>

        <div class="flex flex-wrap gap-4">

          <button class="bg-purple-400 hover:bg-purple-300 text-slate-900 font-semibold px-7 py-3 rounded-2xl transition">
            Join Early Access
          </button>

          <button class="border border-white/20 hover:bg-white/10 px-7 py-3 rounded-2xl transition">
            Share Your Experience
          </button>

        </div>

      </div>

    </div>

  </div>

</section>

</body>
</html>
